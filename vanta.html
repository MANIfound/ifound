<title>ifound</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="ifound är en karta över husen omkring dig, där du kan visa intresse för hus som inte är till salu. Sidan öppnar när kartan är klar." />
<meta name="theme-color" content="#1F2A16" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Familjen+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --green-900:#1F2A16;
    --green-800:#26331B;
    --green-600:#526D33;
    --honey:#D99A3E;
    --paper:#EDF0E7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--green-900);
    color:var(--paper);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex;
    flex-direction:column;
  }
  .wrap{
    width:100%;
    max-width:1080px;
    margin:0 auto;
    padding:28px 16px 56px;
    flex:1;
    display:flex;
    flex-direction:column;
  }

  /* --- logotyp --- */
  .mark{display:flex;align-items:center;gap:9px}
  .mark svg{display:block}
  .mark span{
    font-family:"Familjen Grotesk",system-ui,sans-serif;
    font-size:20px;font-weight:400;letter-spacing:-.005em;
  }
  .mark em{font-style:normal;font-weight:600}

  /* --- komposition --- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:34px;
    margin-top:38px;
  }
  main,.copy,.art,.wrap{min-width:0}
  .art{width:100%;max-width:min(300px,80%);align-self:center}
  .art svg{display:block;width:100%;max-width:100%;height:auto}

  h1{
    font-family:"Familjen Grotesk",system-ui,sans-serif;
    font-weight:600;
    font-size:clamp(2.3rem,8.5vw,3.9rem);
    line-height:1.03;
    letter-spacing:-.012em;
    margin:0 0 20px;
    max-width:none;
  }
  .lede{
    margin:0 0 18px;
    font-size:17px;
    line-height:1.62;
    color:rgba(237,240,231,.74);
    max-width:44ch;
  }
  .status{
    margin:0;
    font-size:15.5px;
    font-weight:500;
    line-height:1.55;
    color:var(--honey);
    max-width:48ch;
  }

  /* --- ritningen --- */
  .parcel{fill:rgba(237,240,231,.035);stroke:var(--green-600);stroke-width:1.1;vector-effect:non-scaling-stroke}
  .found-fill{fill:var(--honey);opacity:.17}
  .found-line{fill:none;stroke:var(--honey);stroke-width:2.1;stroke-linejoin:round}
  .archface{fill:#232F19}

  @media (prefers-reduced-motion:no-preference){
    .found-line{stroke-dasharray:330;stroke-dashoffset:330;animation:draw 1.4s cubic-bezier(.3,.7,.3,1) .45s forwards}
    .found-fill{opacity:0;animation:glow .9s ease-out 1.5s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes glow{to{opacity:.17}}
  }

  @media (min-width:800px){
    .wrap{padding:40px 40px 72px}
    main{
      display:grid;
      grid-template-columns:1.08fr .78fr;
      align-items:start;
      gap:64px;
      margin-top:min(13vh,120px);
    }
    .copy{order:1;padding-top:14px}
    .art{order:2;max-width:360px;align-self:start;justify-self:end;margin-top:-72px}
  }
</style>
</head>

      <div class="copy">
        <h1>Alla hus.<br />Inte bara de<br />till salu.</h1>
        <p class="lede">ifound är en karta över husen omkring dig. Här kan du visa intresse för ett som inte ligger ute till försäljning — ägaren får veta det, och bestämmer själv om fastigheten ska synas.</p>
